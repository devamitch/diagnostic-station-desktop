<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Camera Live Feed</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				margin: 0;
				padding: 0;
				overflow: hidden;
				background: #000;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				width: 100vw;
				height: 100vh;
			}

			.pip-container {
				width: 100%;
				height: 100%;
				position: relative;
				background: #000;
			}

			.pip-video {
				width: 100%;
				height: 100%;
				object-fit: cover;
				transform: scaleX(-1);
			}

			.pip-canvas {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				pointer-events: none;
				transform: scaleX(-1);
			}

			.pip-controls {
				position: absolute;
				bottom: 10px;
				left: 50%;
				transform: translateX(-50%);
				display: flex;
				gap: 8px;
				opacity: 0;
				transition: opacity 0.3s;
				padding: 8px 12px;
				border-radius: 20px;
				background: rgba(0, 0, 0, 0.7);
			}

			.pip-container:hover .pip-controls {
				opacity: 1;
			}

			.pip-controls button {
				width: 32px;
				height: 32px;
				border: none;
				border-radius: 50%;
				background: #333;
				color: white;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 14px;
			}

			.pip-controls button:hover {
				background: #555;
			}

			.status-indicator {
				position: absolute;
				top: 10px;
				right: 10px;
				padding: 4px 8px;
				background: rgba(0, 0, 0, 0.7);
				color: #00ff00;
				font-size: 10px;
				border-radius: 10px;
			}

			.error-message {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				color: white;
				text-align: center;
				padding: 20px;
				background: rgba(255, 0, 0, 0.7);
				border-radius: 10px;
				max-width: 80%;
			}
		</style>
	</head>
	<body>
		<div class="pip-container">
			<video id="pipVideo" class="pip-video" autoplay playsinline muted></video>
			<canvas id="pipCanvas" class="pip-canvas"></canvas>

			<div class="status-indicator">● LIVE</div>

			<div class="pip-controls">
				<button id="exitBtn" title="Exit">✕</button>
			</div>
		</div>

		<script>
			console.log('[Camera] Initializing...');

			const video = document.getElementById('pipVideo');
			const canvas = document.getElementById('pipCanvas');
			const ctx = canvas.getContext('2d');
			const exitBtn = document.getElementById('exitBtn');

			// Initialize camera
			async function initializeCamera() {
				console.log('[Camera] Setting up camera...');

				try {
					// Request camera access
					const stream = await navigator.mediaDevices.getUserMedia({
						video: {
							width: { ideal: 1920 },
							height: { ideal: 1080 },
							facingMode: 'user', // Use front camera
						},
						audio: false,
					});

					// Set video source
					video.srcObject = stream;

					video.onloadedmetadata = () => {
						console.log('[Camera] Video ready, playing...');
						video.play().catch(console.error);
					};

					// Set canvas size to match video
					video.addEventListener('loadeddata', () => {
						canvas.width = video.videoWidth;
						canvas.height = video.videoHeight;
					});

					console.log('[Camera] Camera access granted');
				} catch (error) {
					console.error('[Camera] Error accessing camera:', error);
					showError('Could not access camera. Please check permissions.');
				}
			}

			// Show error message
			function showError(message) {
				const errorDiv = document.createElement('div');
				errorDiv.className = 'error-message';
				errorDiv.textContent = message;
				document.body.appendChild(errorDiv);
			}

			// Exit button
			exitBtn.addEventListener('click', () => {
				// Stop all video tracks
				if (video.srcObject) {
					const tracks = video.srcObject.getTracks();
					tracks.forEach((track) => track.stop());
				}

				// Close window if in Electron, otherwise just show message
				if (window.ipc && typeof window.ipc.closePiPWindow === 'function') {
					window.ipc.closePiPWindow();
				} else {
					alert('Camera feed stopped. Refresh page to restart.');
				}
			});

			// Initialize when ready
			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', initializeCamera);
			} else {
				initializeCamera();
			}

			console.log('[Camera] Ready for camera access');
		</script>
	</body>
</html>
