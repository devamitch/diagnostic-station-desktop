す。まばたき頻度、眼精疲労、疲労度、視聴距離などの指標を追跡し、包括的な目の健康モニタリングを提供します。\"},{\"question\":\"カメラデータは安全ですか？\",\"answer\":\"はい、完全に安全です。全てのカメラ処理は端末内でローカルに行われます。カメラ映像はサーバーに送信されることはありません。進捗追跡のために匿名化された目の健康指標のみが保存されます。\"},{\"question\":\"oLoはどのような指標を追跡しますか？\",\"answer\":\"oLoはまばたき頻度、眼精疲労レベル、乾燥・充血度、目の下のくま、疲労度、画面距離、注意力、目を細める度合いなど、複数の目の健康指標を追跡します。また、目の総合的なエネルギーレベルも表示します。\"},{\"question\":\"目のエネルギー表示はどのように機能しますか？\",\"answer\":\"目のエネルギーは100%から始まり、眼精疲労、長時間の画面使用、不適切な視聴習慣によって減少します。休憩、適切なまばたき、良い目のケア習慣によって増加します。これにより一目で目の健康状態を把握できます。\"},{\"question\":\"ピクチャーインピクチャーモードとは何ですか？\",\"answer\":\"ピクチャーインピクチャーモードでは、他の作業を行いながら目の追跡を継続できます。追跡ウィンドウが小さなオーバーレイで表示されるため、アプリを常に開いたままにする必要はありません。\"},{\"question\":\"どの端末でもoLoを使用できますか？\",\"answer\":\"oLoはカメラと最新のウェブブラウザ（Chrome、Safari、Edge、Firefoxなど）を備えた全ての端末で動作します。プログレッシブウェブアプリのため、端末にインストールしてデスクトップ、モバイル、タブレットでネイティブアプリのような体験を得ることができます。\"},{\"question\":\"どのくらいの頻度で休憩を取るべきですか？\",\"answer\":\"20-20-20ルールに従うことをお勧めします：20分ごとに、6メートル（約20フィート）先の何かを20秒間見ます。oLoは継続的な眼精疲労を検出したり、画面の前での時間が長すぎる場合にスマート通知を送信します。\"},{\"question\":\"oLoは複数の言語で利用できますか？\",\"answer\":\"はい、oLoは現在英語、日本語、韓国語で利用可能です。設定ページでいつでも言語を変更できます。\"},{\"question\":\"目の健康スコアを改善するにはどうすればよいですか？\",\"answer\":\"目の健康を改善するには：20-20-20ルールによる定期的な休憩、適切な視聴距離（50-70cm）の維持、頻繁かつ完全なまばたき、画面の明るさと文字サイズの調整、反射の軽減、十分な水分補給と睡眠が効果的です。\"},{\"question\":\"目の追跡が機能しない場合はどうすればよいですか？\",\"answer\":\"目の追跡が機能しない場合：ブラウザ設定でカメラの権限が許可されていることを確認、十分な照明環境を確保、カメラの前に適切に位置、ページの更新、他のアプリがカメラを使用していないか確認してください。\"},{\"question\":\"oLoはオフラインで動作しますか？\",\"answer\":\"oLoはアプリケーションロードに初回インターネット接続が必要ですが、ロード後は全ての処理が端末内でローカルに行われるため目の追跡はオフラインで動作します。アカウントへのデータ同期にはインターネット接続が必要です。\"},{\"question\":\"oLoの目の追跡精度はどのくらいですか？\",\"answer\":\"oLoはGoogle Researchが開発した高度なMediaPipeアルゴリズムを使用しており、健康目的のために高精度な目の追跡を提供します。医療グレードの診断機器ではありませんが、健康パターンのモニタリングと健康的な画面習慣の維持に役立ちます。\"},{\"question\":\"メガネやコンタクトレンズでoLoを使用できますか？\",\"answer\":\"はい、oLoはメガネとコンタクトレンズの両方で機能します。メガネを使用する場合、レンズの反射を最小限にし、カメラに目が明確に見えるように位置を調整することで最良の結果が得られます。\"},{\"question\":\"oLoは医療機器ですか？\",\"answer\":\"いいえ、oLoは健康アプリケーションであり、医療機器ではありません。医学的状態の診断、治療、予防を行うものではありません。oLoは目の健康をモニタリングし、健康的な画面習慣を維持するための支援を目的としています。医学的な懸念がある場合は、常に資格のある眼科専門医にご相談ください。\"},{\"question\":\"アカウントとデータを削除するにはどうすればよいですか？\",\"answer\":\"設定→アカウント→アカウント削除からいつでもアカウントと関連データを削除できます。削除後、全てのデータは30日以内にサーバーから完全に削除されます。\"},{\"question\":\"oLoは第三者に私のデータを共有しますか？\",\"answer\":\"いいえ、お客様の明示的な同意なしに個人データを第三者と共有することはありません。カメラデータは送信・保存されず、集計された匿名の健康統計のみが研究と製品改善のために使用される場合があります。\"},{\"question\":\"oLoのシステム要件は何ですか？\",\"answer\":\"oLoにはカメラと最新のウェブブラウザを備えた端末が必要です。推奨ブラウザ：Chrome 90以降、Safari 14以降、Edge 90以降、Firefox 88以降。最適な体験のため安定したインターネット接続を推奨します。\"},{\"question\":\"複数の人が同じ端末でoLoを使用できますか？\",\"answer\":\"はい、別々のアカウントを作成することで複数の人が同じ端末でoLoを使用できます。各ユーザーは独自のパーソナライズされた健康追跡と洞察を持ちます。アカウント間の切り替えはログアウト後、異なる認証情報でログインするだけです。\"},{\"question\":\"サポートに連絡するにはどうすればよいですか？\",\"answer\":\"preetam@AuraCoremedical.comまたはウェブサイトのお問い合わせページからサポートチームにご連絡ください。通常、営業日24-48時間以内に回答いたします。\"}]},\"faqOld\":{\"title\":\"よくある質問\",\"subtitle\":\"oLoに関するよくあるご質問にお答えします\",\"questions\":[{\"question\":\"oLoとは何ですか？\",\"answer\":\"oLoは、目の健康をリアルタイムでモニタリング・改善するAI搭載のプログレッシブウェブアプリケーションです。高度なコンピュータービジョンとMediaPipeアルゴリズムを使用して目の指標を追跡し、パーソナライズされた洞察を提供、デジタル眼精疲労の予防を支援します。\"},{\"question\":\"目の追跡はどのように機能しますか？\",\"answer\":\"oLoは端末のカメラと高度なAIアルゴリズム（MediaPipe）を使用してリアルタイムで目の状態を検出・分析します。全ての処理はプライバシー保護のため端末内でローカルに行われます。まばたき頻度、眼精疲労、疲労度、視聴距離などの指標を追跡し、包括的な目の健康モニタリングを提供します。\"},{\"question\":\"カメラデータは安全ですか？\",\"answer\":\"はい、完全に安全です。全てのカメラ処理は端末内でローカルに行われます。カメラ映像はサーバーに送信されることはありません。進捗追跡のために匿名化された目の健康指標のみが保存されます。\"},{\"question\":\"oLoはどのような指標を追跡しますか？\",\"answer\":\"oLoはまばたき頻度、眼精疲労レベル、乾燥・充血度、目の下のくま、疲労度、画面距離、注意力、目を細める度合いなど、複数の目の健康指標を追跡します。また、目の総合的なエネルギーレベルも表示します。\"},{\"question\":\"目のエネルギー表示はどのように機能しますか？\",\"answer\":\"目のエネルギーは100%から始まり、眼精疲労、長時間の画面使用、不適切な視聴習慣によって減少します。休憩、適切なまばたき、良い目のケア習慣によって増加します。これにより一目で目の健康状態を把握できます。\"},{\"question\":\"ピクチャーインピクチャーモードとは何ですか？\",\"answer\":\"ピクチャーインピクチャー（PiP）モードでは、他の作業を行いながら目の追跡を継続できます。追跡ウィンドウが小さなオーバーレイで表示されるため、アプリを常に開いたままにする必要はありません。\"},{\"question\":\"どの端末でもoLoを使用できますか？\",\"answer\":\"oLoはカメラと最新のウェブブラウザ（Chrome、Safari、Edge、Firefox）を備えた全ての端末で動作します。プログレッシブウェブアプリ（PWA）のため、端末にインストールしてデスクトップ、モバイル、タブレットでネイティブアプリのような体験を得ることができます。\"},{\"question\":\"どのくらいの頻度で休憩を取るべきですか？\",\"answer\":\"20-20-20ルールに従うことをお勧めします：20分ごとに、6メートル（約20フィート）先の何かを20秒間見ます。oLoは継続的な眼精疲労を検出したり、画面の前での時間が長すぎる場合にスマート通知を送信します。\"},{\"question\":\"oLoは複数の言語で利用できますか？\",\"answer\":\"はい！oLoは現在英語、日本語、韓国語で利用可能です。設定ページでいつでも言語を変更できます。\"},{\"question\":\"目の健康スコアを改善するにはどうすればよいですか？\",\"answer\":\"目の健康を改善するには：20-20-20ルールによる定期的な休憩、適切な視聴距離（50-70cm）の維持、頻繁かつ完全なまばたき、画面の明るさと文字サイズの調整、反射の軽減、十分な水分補給と睡眠が効果的です。\"},{\"question\":\"目の追跡が機能しない場合はどうすればよいですか？\",\"answer\":\"目の追跡が機能しない場合：1）カメラの権限が許可されていることを確認、2）十分な照明環境を確保、3）カメラの前に適切に位置、4）ページを更新、5）他のアプリがカメラを使用していないか確認してください。\"}]},\"download\":{\"title\":\"oLo - 目の健康アプリをダウンロード\",\"description\":\"iOS、Android、macOS、Windows、Linux向けoLoをダウンロード。全ての端末で目の健康をモニタリング。\",\"hero\":{\"title\":\"oLoをダウンロード\",\"subtitle\":\"全ての端末でoLoを使用し、どこでも目の健康を管理\"},\"mobile\":{\"ios\":{\"title\":\"iOSアプリ\",\"description\":\"iPhoneとiPadに対応。どこでも目の健康を追跡できます。\",\"button\":\"App Storeからダウンロード\"},\"android\":{\"title\":\"Androidアプリ\",\"description\":\"Android端末に対応。外出先でも目の健康を管理。\",\"button\":\"Google Playから入手\"}},\"desktop\":{\"macos\":{\"title\":\"macOSアプリ\",\"description\":\"Mac向けネイティブアプリ。Apple Siliconに最適化。\",\"button\":\"Mac版をダウンロード\"},\"windows\":{\"title\":\"Windowsアプリ\",\"description\":\"Windows 10/11に対応。エンタープライズ環境でも利用可能。\",\"button\":\"Windows版をダウンロード\"}}},\"supportPage\":{\"title\":\"サポートセンター\",\"subtitle\":\"oLoの効果的な活用をサポートします\",\"email\":{\"title\":\"メールサポート\",\"description\":\"専門サポートチームによる詳細なサポート\",\"address\":\"support@AuraCoremedical.com\",\"responseTime\":\"24-48時間以内に回答\"},\"inApp\":{\"title\":\"アプリ内サポート\",\"description\":\"アプリ内で直接クイックサポート\",\"location\":\"設定 → ヘルプとサポート\",\"availability\":\"24時間年中無休対応\"},\"helpCenter\":{\"title\":\"ヘルプセンター\",\"description\":\"記事とガイドを閲覧\",\"link\":\"よくある質問を確認\",\"articles\":\"包括的なナレッジベース\"},\"form\":{\"title\":\"お問い合わせフォーム\",\"description\":\"以下のフォームからお問い合わせください。迅速に対応いたします\
